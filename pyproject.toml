[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcap-method"
version = "0.1.0"
description = "Target-Conditioned Asymmetric Parameter Projection for TabICL-v2 and TabPFN-v3"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["numpy>=1.24", "pandas>=1.5", "scikit-learn>=1.6"]

[project.optional-dependencies]
tabicl = ["tabicl==2.1.1", "torch>=2.6", "einops>=0.7", "tqdm>=4.64", "transformers>=4.44"]
tabpfn = ["tabpfn==8.5.0", "torch>=2.6", "typing_extensions>=4.12", "tqdm>=4.66"]
test = ["pytest>=8"]

[project.scripts]
tcap = "tcap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"share/tcap-method" = ["THIRD_PARTY_NOTICES.md"]
"share/tcap-method/licenses" = ["licenses/TabICL-LICENSE", "licenses/TabPFN-LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
